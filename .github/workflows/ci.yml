name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: PHP ${{ matrix.php }} · ${{ matrix.db }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        db: [sqlite, mysql]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: flarum_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      DB_DRIVER: ${{ matrix.db }}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: flarum_test
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, pdo_mysql, pdo_sqlite, mbstring, intl
          coverage: none

      - run: composer install --no-interaction --no-progress

      - run: composer test:setup

      - run: composer test

  frontend:
    name: JS build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install --no-audit --no-fund

      - run: npm run format-check

      - run: npm run build

      # js/dist is committed (Flarum loads it straight from the package):
      # fail if somebody changed the sources without rebuilding.
      - run: git diff --exit-code -- dist
